<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Médicos - Hospital System</title>
    <link rel="stylesheet" href="../css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-brand"> Hospital System</div>
        <ul class="navbar-menu">
            <li><a href="../index.html">Inicio</a></li>
            <li><a href="patients.html">Pacientes</a></li>
            <li><a href="doctors.html">Médicos</a></li>
            <li><a href="appointments.html">Citas</a></li>
        </ul>
    </nav>

    <div class="page-container">
        <h1 class="page-title"> Gestión de Médicos</h1>

        <div id="alert" class="alert"></div>

        <div class="form-card">
            <h2 id="form-title">Nuevo Médico</h2>
            <input type="hidden" id="doctor-id">
            <div class="form-row">
                <div class="form-group">
                    <label>Nombre</label>
                    <input type="text" id="name" placeholder="Dr. Nombre Apellido">
                </div>
                <div class="form-group">
                    <label>Especialidad</label>
                    <input type="text" id="specialty" placeholder="Cardiología">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="doctor@hospital.com">
                </div>
                <div class="form-group">
                    <label>Teléfono</label>
                    <input type="text" id="phone" placeholder="3101234567">
                </div>
            </div>
            <div style="display:flex; gap:1rem; margin-top:1rem">
                <button class="btn btn-primary" onclick="saveDoctor()"> Guardar</button>
                <button class="btn btn-warning" onclick="clearForm()"> Limpiar</button>
            </div>
        </div>

        <div class="table-card">
            <h2>Lista de Médicos</h2>
            <div class="search-bar">
                <input type="text" id="search-id" placeholder="Buscar por ID...">
                <button class="btn btn-primary" onclick="findById()">Buscar</button>
                <button class="btn btn-success" onclick="loadDoctors()"> Ver todos</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Especialidad</th>
                        <th>Email</th>
                        <th>Teléfono</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="doctors-table"></tbody>
            </table>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/doctors.js"></script>
</body>
</html>
